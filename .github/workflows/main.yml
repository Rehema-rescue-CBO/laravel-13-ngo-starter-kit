name: Deploy Laravel 13

on:
  push:
    branches:
      - develop

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mbstring, bcmath, intl, pdo_mysql
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install NPM Packages
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP_SCRIPT'
          set ftp:passive-mode yes
          set ftp:nat-workaround yes
          set ftp:ssl-allow no
          set net:timeout 120
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror --reverse --verbose \
            --exclude ^storage/ \
            --exclude ^public/videos/ \
            --exclude ^public/banner/ \
            --exclude ^public/mentorship/ \
            --exclude ^public/partners/ \
            --exclude ^public/slider/ \
            --exclude ^public/team/ \
            --exclude ^public/testmonionals/ \
            --exclude ^public/sgvb/ \
            --exclude ^\.env$ \
            --exclude ^node_modules/ \
            --exclude ^tests/ \
            --exclude ^vendor/ \
            --exclude ^\.git/ \
            --exclude ^\.github/ \
            --exclude ^\.claude/ \
            --exclude ^\.cursor/ \
            --exclude ^bootstrap/cache/ \
            . public_html
          quit
          LFTP_SCRIPT
